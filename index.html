<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AymaPOS Core · ECOKAIZEN Continuous Audio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght=400;500;700&family=Outfit:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#03050a;--surface:#070a14;--card:#0a0f24;--card2:#0f1736;--border:#162447;
  --txt:#ecf3ff;--dim:#536d9e;--muted:#738ebf;--cyan:#00f0ff;--green:#00ffaa;--red:#ff4772;
  --gold-light:#ffe89e;--gold-mid:#d4af37;
  --gold-gradient: linear-gradient(135deg, #ffe89e 0%, #d4af37 40%, #aa7c11 70%, #f3e5ab 100%);
}
body{background:var(--ink);font-family:'Outfit',sans-serif;color:var(--txt);min-height:100vh;padding:16px;display:flex;justify-content:center}
.smartphone-shell{width:100%;max-width:412px;background:#000;border-radius:40px;padding:12px;box-shadow:0 25px 60px rgba(0,0,0,0.8);border:2px solid #333}
.screen{background:var(--ink);border-radius:32px;width:100%;height:100%;overflow-y:auto;padding:20px 16px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;background:var(--gold-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.voice-panel{background:var(--card);border:1px solid rgba(212,175,55,0.2);border-radius:20px;padding:16px;margin-bottom:20px;text-align:center}
.mic-btn{width:56px;height:56px;border-radius:50%;background:var(--gold-gradient);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);box-shadow:0 0 15px rgba(212,175,55,0.4);margin-bottom:10px}
.mic-btn.listening{background:linear-gradient(135deg,var(--red),#ff7693);box-shadow:0 0 20px rgba(255,71,114,0.5);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.transcript-area{font-size:13px;color:#fff;font-weight:500;background:rgba(255,255,255,0.03);padding:8px;border-radius:10px;min-height:45px;margin-bottom:12px;line-height:1.4;border:1px solid rgba(255,255,255,0.05);word-break:break-word}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.btn-clear-all{background:transparent;border:1px solid var(--red);color:var(--red);padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer}
.items-container{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.empty-state{text-align:center;padding:30px 20px;color:var(--dim);font-size:13px;border:1px dashed rgba(255,255,255,0.05);border-radius:16px}
.product-card{background:var(--card);border:1px solid rgba(212,175,55,0.25);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;position:relative}
.editable-name-input{background:transparent;border:none;border-bottom:1px dashed var(--dim);color:#fff;font-size:14px;font-weight:700;width:90%;text-transform:uppercase;padding:2px 0}
.editable-name-input:focus{border-bottom:1px solid var(--gold-mid);outline:none}
.prod-details-row{display:flex;align-items:center;justify-content:space-between;background:var(--card2);padding:6px 10px;border-radius:8px;margin-top:4px}
.inputs-grp{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.input-cell{background:var(--ink);border:1px solid var(--border);color:#fff;font-family:'DM Mono',monospace;font-size:12px;padding:4px;border-radius:6px;text-align:center}
.btn-delete-item{background:transparent;border:none;color:var(--red);font-size:16px;cursor:pointer;padding:8px;position:absolute;right:4px;top:8px}
.total-display-box{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.total-lbl{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--muted)}
.total-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:700;color:var(--green)}
.btn-pagar{width:100%;padding:14px;border-radius:14px;background:var(--gold-gradient);border:none;font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>
<div class="smartphone-shell">
  <div class="screen">
    <div class="topbar">
      <div class="brand"><div class="app-title">AymaPOS Core</div></div>
      <div style="font-family:'DM Mono',monospace; font-size:10px; color:var(--gold-light)">● ECOKAIZEN</div>
    </div>
    <div class="voice-panel">
      <button class="mic-btn" id="mic-trigger" onclick="toggleVoiceRecognition()">🔊</button>
      <div id="mic-label" style="font-size:11px; font-weight:600; color:var(--gold-light)">Toca una vez para empezar a dictar</div>
      <div class="transcript-area" id="transcript-txt">"El micrófono no se apagará solo. Habla todo lo que quieras y vuélvelo a tocar para finalizar..."</div>
    </div>
    <div class="section-header">
      <div style="font-family:'DM Mono',monospace; font-size:10px; color:var(--gold-light); text-transform:uppercase">Estructura de Comprobante</div>
      <button class="btn-clear-all" id="clear-all-btn" style="display:none;" onclick="clearEntireCart()">🗑️ Vaciar Todo</button>
    </div>
    <div class="items-container" id="cart-wrapper">
      <div class="empty-state">Esperando dictado continuo de almacén...</div>
    </div>
    <div class="total-display-box"><span class="total-lbl">TOTAL NETO</span><span class="total-val" id="screen-total">S/ 0.00</span></div>
    <button class="btn-pagar" onclick="window.print()">Imprimir Ticket 80mm 🖨️</button>
  </div>
</div>

<script>
let cart = []; let recognition; let isListening = false;
let accumulatedText = "";

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  
  // CONFIGURACIÓN INDUSTRIAL DE GOOGLE: Modo continuo activado para que no se corte solo
  recognition.lang = 'es-PE';
  recognition.continuous = true; 
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    accumulatedText = "";
    document.getElementById('mic-trigger').className = "mic-btn listening";
    document.getElementById('mic-label').innerText = "🛑 DETENER AUDIO AL TERMINAR";
  };

  recognition.onerror = () => { stopMicUI(); };
  recognition.onend = () => { stopMicUI(); };

  recognition.onresult = (event) => {
    let interimTranscript = "";
    let finalTranscript = "";

    for (let i = event.resultIndex; i < event.results.length; ++i) {
      if (event.results[i].isFinal) {
        finalTranscript += event.results[i][0].transcript + " ";
      } else {
        interimTranscript += event.results[i][0].transcript;
      }
    }

    if (finalTranscript !== "") {
      accumulatedText += finalTranscript;
      // Procesamos en tiempo real cada bloque cerrado que la IA entienda
      parseAudioSegment(finalTranscript.toLowerCase());
    }
    
    document.getElementById('transcript-txt').innerText = accumulatedText + interimTranscript;
  };
}

function toggleVoiceRecognition() {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

function stopMicUI() {
  isListening = false;
  document.getElementById('mic-trigger').className = "mic-btn";
  document.getElementById('mic-label').innerText = "🔊 Toca para hablar (Modo Continuo)";
}

function parseAudioSegment(text) {
  let cleaned = text.replace(/puntos|punto/g, '.').replace(/escuchar|el numero|el número|hasta|ósea|osea/g, '').trim();
  if (cleaned.length < 3) return;

  const numbers = cleaned.match(/\d+(\.\d+)?/g) ? cleaned.match(/\d+(\.\d+)?/g).map(Number) : [];
  
  let pName = "PRODUCTO GENERAL";
  let pUnit = "1 Paquete";
  let pPrice = 0.00;

  // 1. Identificar tipo de empaque
  if (cleaned.includes("deli") || cleaned.includes("litro")) pName = "DELI 1 LITRO";
  else if (cleaned.includes("plato") || cleaned.includes("plata")) pName = "PLATO DE CAÑA";
  else if (cleaned.includes("vaso")) pName = "VASO";
  else if (cleaned.includes("bolsa") || cleaned.includes("pet")) pName = "BOLSA PET";
  else if (cleaned.includes("cuchara")) pName = "CUCHARA";
  else if (cleaned.includes("bandeja")) pName = "BANDEJA";
  else if (cleaned.includes("cochera")) pName = "COCHERA";

  // Modelo numérico (#)
  const modelMatch = cleaned.match(/(?:número|numero|nro|n°|vaso|plato|bolsa|cuchara|bandeja)\s*(\d+)/);
  if (modelMatch) {
    pName += " #" + modelMatch[1];
  } else if (numbers.length > 0 && pName !== "DELI 1 LITRO" && pName !== "COCHERA") {
    pName += " #" + numbers[0];
  } else if (numbers.length > 0 && pName === "COCHERA") {
    pName += " N° " + numbers[0];
  }

  // 2. Unidades de volumen mayorista (No se mezclan con el nombre)
  if (cleaned.includes("cuarto")) pUnit = "1/4 Ciento";
  else if (cleaned.includes("medio ciento")) pUnit = "1/2 Ciento";
  else if (cleaned.includes("ciento")) pUnit = "1 Ciento";
  else if (cleaned.includes("millar")) pUnit = "1 Millar";
  else if (cleaned.includes("docena")) pUnit = "1 Docena";
  else if (cleaned.includes("caja")) pUnit = "1 Caja";
  else {
    const packageMatch = cleaned.match(/(\d+)\s*paquete/);
    if (packageMatch) {
      pUnit = `${packageMatch[1]} Paquetes`;
    } else if (cleaned.includes("paquete")) {
      pUnit = "1 Paquete";
    }
  }

  // 3. El último número es estrictamente asignado al precio de venta
  if (numbers.length > 0) {
    pPrice = numbers[numbers.length - 1];
  }
  if (numbers.length === 1 && cleaned.includes("soles")) {
    pPrice = numbers[0];
  }

  if (pName === "PRODUCTO GENERAL") {
    pName = cleaned.toUpperCase();
  }

  // Insertar al comprobante activo
  cart.push({ name: pName, unit: pUnit, price: Number(pPrice) });
  renderCartUI();
}

function renderCartUI() {
  const wrapper = document.getElementById('cart-wrapper'); const clearBtn = document.getElementById('clear-all-btn');
  wrapper.innerHTML = "";
  if (cart.length === 0) {
    wrapper.innerHTML = '<div class="empty-state">Esperando dictado continuo de almacén...</div>';
    clearBtn.style.display = "none"; document.getElementById('screen-total').innerText = "S/ 0.00"; return;
  }
  clearBtn.style.display = "block"; let totalGeneral = 0;
  cart.forEach((item, index) => {
    totalGeneral += Number(item.price);
    const card = document.createElement('div'); card.className = 'product-card';
    card.innerHTML = `
      <div class="card-row-top">
        <input type="text" class="editable-name-input" value="${item.name}" onchange="updateCartItemDirectly(${index}, 'name', this.value)">
      </div>
      <div class="prod-details-row">
        <div class="inputs-grp">
          <span>Cant:</span>
          <input type="text" class="input-cell" style="width: 100px;" value="${item.unit}" onchange="updateCartItemDirectly(${index}, 'unit', this.value)">
        </div>
        <div class="inputs-grp">
          <span>Total S/</span>
          <input type="number" step="0.50" class="input-cell" style="width: 75px; color:var(--green); font-weight:700;" value="${Number(item.price).toFixed(2)}" oninput="updateCartItemDirectly(${index}, 'price', this.value)">
        </div>
      </div>
      <button class="btn-delete-item" onclick="deleteSingleItem(${index})">❌</button>
    `;
    wrapper.appendChild(card);
  });
  document.getElementById('screen-total').innerText = 'S/ ' + totalGeneral.toFixed(2);
}

function updateCartItemDirectly(index, key, val) {
  if (key === 'price') cart[index].price = Number(val) || 0;
  else if (key === 'unit') cart[index].unit = val;
  else if (key === 'name') cart[index].name = val.toUpperCase();
  
  let totalGeneral = 0; cart.forEach(item => totalGeneral += Number(item.price));
  document.getElementById('screen-total').innerText = 'S/ ' + totalGeneral.toFixed(2);
}

function deleteSingleItem(index) { cart.splice(index, 1); renderCartUI(); }
function clearEntireCart() { cart = []; renderCartUI(); }
</script>
</body>
</html>
